document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

========================================================\n   NIED Colors — \"Newsletter Brights\" variant\n   All hex values are exact, pulled from the brand kit.\n   ============================================================ */\n:root {\n  /* --- Primary palette --- */\n  --color-action-blue: #2E4FA3;   /* primary buttons, links, key icons */\n  --color-blue-deep: #24407F;     /* hover / pressed for blue */\n  --color-navy: #1F2A5A;          /* headings, footer, deep hero bg */\n  --color-blue-mist: #EEF2FB;     /* soft section fill, selected chips */\n  --color-white: #FFFFFF;         /* cards, surfaces */\n  --color-cream: #F7F3EA;         /* default page background */\n\n  /* --- Secondary palette (newsletter brights) --- */\n  --color-periwinkle: #5C6FC4;    /* trust / links */\n  --color-periwinkle-hover: #4858A8;\n  --color-periwinkle-fill: #EEF2FB;\n\n  --color-gold: #ECA233;          /* events / highlights — FILL/ACCENT ONLY */\n  --color-gold-text: #8A5E1A;     /* gold-coloured text on white */\n  --color-gold-fill: #FBE5C4;\n\n  --color-rose: #C13362;          /* donation / warmth */\n  --color-rose-hover: #A32A52;\n  --color-rose-fill: #FDEEF2;\n\n  --color-purple: #6C3FA3;        /* community / caregiver */\n  --color-purple-hover: #5A3389;\n  --color-purple-fill: #EEE7F6;\n\n  --color-green: #4CA66B;         /* programs / growth — LARGE/FILL ONLY */\n  --color-green-solid: #2F7A4A;   /* green button / small text (white ok) */\n  --color-green-fill: #E4F3EA;\n\n  /* --- Text --- */\n  --text-heading: #1F2A5A;        /* Deep Navy — all headings */\n  --text-body: #3A3A3A;           /* Soft Charcoal — paragraphs */\n  --text-muted: #6E7780;          /* Cool Grey — captions, labels (>=15px) */\n  --text-link: #2E4FA3;           /* Action Blue */\n  --text-on-color: #FFFFFF;       /* text on navy/blue/rose/purple/periwinkle */\n\n  /* --- Surfaces / backgrounds --- */\n  --surface-page: #F7F3EA;\n  --surface-card: #FFFFFF;\n  --surface-deep: #1F2A5A;\n  --surface-soft-blue: #EEF2FB;\n  --surface-soft-purple: #EEE7F6;\n  --surface-soft-rose: #FDEEF2;\n  --surface-soft-gold: #FBE5C4;\n  --surface-soft-green: #E4F3EA;\n\n  /* --- Lines --- */\n  --border-hairline: #D8DCEA;     /* card borders, dividers */\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   NIED Typography — Poppins throughout\n   Sizes given desktop; mobile variants noted in comments.\n   ============================================================ */\n:root {\n  --font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;\n\n  /* weights */\n  --font-weight-regular: 400;\n  --font-weight-medium: 500;\n  --font-weight-semibold: 600;\n  --font-weight-bold: 700;\n\n  /* --- Heading scale (desktop) --- */\n  --font-size-h1: 56px;    /* mobile 36 */\n  --font-size-h2: 40px;    /* mobile 28 */\n  --font-size-h3: 30px;    /* mobile 22 */\n  --font-size-h4: 22px;    /* mobile 18 */\n  --font-size-eyebrow: 14px; /* mobile 13, UPPERCASE +0.08em */\n\n  /* --- Body scale (desktop) --- */\n  --font-size-lead: 20px;  /* mobile 18 */\n  --font-size-body: 18px;  /* mobile 16 */\n  --font-size-small: 15px; /* mobile 14 */\n  --font-size-button: 17px;/* mobile 16 */\n\n  /* line heights */\n  --line-height-h1: 1.1;\n  --line-height-h2: 1.15;\n  --line-height-h3: 1.2;\n  --line-height-h4: 1.3;\n  --line-height-body: 1.6;\n  --line-height-small: 1.5;\n  --line-height-eyebrow: 1.4;\n\n  /* letter spacing */\n  --letter-spacing-heading: -0.01em;\n  --letter-spacing-eyebrow: 0.08em;\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   NIED Spacing, radii, shadows, transitions\n   ============================================================ */\n:root {\n  /* --- Spacing scale --- */\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 24px;   /* gap between cards */\n  --space-6: 32px;   /* card padding (desktop) */\n  --space-7: 48px;\n  --space-8: 64px;\n  --space-9: 96px;   /* section rhythm */\n\n  /* --- Radii --- */\n  --radius-card: 16px;    /* cards, images */\n  --radius-pill: 999px;   /* buttons, chips, avatars */\n  --radius-sm: 8px;       /* inputs, small elements */\n\n  /* --- Shadows (soft, navy-tinted) --- */\n  --shadow-card: 0 4px 16px rgba(31, 42, 90, 0.08);\n  --shadow-card-hover: 0 8px 24px rgba(31, 42, 90, 0.12);\n\n  /* --- Overlay --- */\n  --overlay-image: rgba(31, 42, 90, 0.45); /* soft navy over photos */\n\n  /* --- Motion --- */\n  --transition-base: 200ms ease; /* @kind other */\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   NIED Design System — global entry point.\n   Consumers link THIS file. Import lines only.\n   ============================================================ */\n/* NIED uses Poppins (Google Fonts). Loaded via CDN — no local binaries. */\n/* devanagari */\n@font-face {\n  font-family: 'Poppins';\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"c341f3f9-e678-4730-9cf3-0f491887be29\") format('woff2');\n  unicode-range: U+0900-097F, U+1CD0-1CF9, U+200C-200D, U+20A8, U+20B9, U+20F0, U+25CC, U+A830-A839, U+A8E0-A8FF, U+11B00-11B09;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Poppins';\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"798cd24e-9701-4841-95de-71003ad6ffe0\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Poppins';\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"aeb8b7ef-b16a-40fc-bdff-2f5e4247e5dc\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+219 2CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Poppins';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"621695c7-b980-4b88-9b2c-055fb7959d6f\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* ============================================================\n   NIED Colors — \"Newsletter Brights\" variant\n   All hex values are exact, pulled from the brand kit.\n   ============================================================ */\n:root {\n  /* --- Primary palette --- */\n  --color-action-blue: #2E4FA3;   /* primary buttons, links, key icons */\n  --color-blue-deep: #24407F;     /* hover / pressed for blue */\n  --color-navy: #1F2A5A;          /* headings, footer, deep hero bg */\n  --color-blue-mist: #EEF2FB;     /* soft section fill, selected chips */\n  --color-white: #FFFFFF;         /* cards, surfaces */\n  --color-cream: #F7F3EA;         /* default page background */\n\n  /* --- Secondary palette (newsletter brights) --- */\n  --color-periwinkle: #5C6FC4;    /* trust / links */\n  --color-periwinkle-hover: #4858A8;\n  --color-periwinkle-fill: #EEF2FB;\n\n  --color-gold: #ECA233;          /* events / highlights — FILL/ACCENT ONLY */\n  --color-gold-text: #8A5E1A;     /* gold-coloured text on white */\n  --color-gold-fill: #FBE5C4;\n\n  --color-rose: #C13362;          /* donation / warmth */\n  --color-rose-hover: #A32A52;\n  --color-rose-fill: #FDEEF2;\n\n  --color-purple: #6C3FA3;        /* community / caregiver */\n  --color-purple-hover: #5A3389;\n  --color-purple-fill: #EEE7F6;\n\n  --color-green: #4CA66B;         /* programs / growth — LARGE/FILL ONLY */\n  --color-green-solid: #2F7A4A;   /* green button / small text (white ok) */\n  --color-green-fill: #E4F3EA;\n\n  /* --- Text --- */\n  --text-heading: #1F2A5A;        /* Deep Navy — all headings */\n  --text-body: #3A3A3A;           /* Soft Charcoal — paragraphs */\n  --text-muted: #6E7780;          /* Cool Grey — captions, labels (>=15px) */\n  --text-link: #2E4FA3;           /* Action Blue */\n  --text-on-color: #FFFFFF;       /* text on navy/blue/rose/purple/periwinkle */\n\n  /* --- Surfaces / backgrounds --- */\n  --surface-page: #F7F3EA;\n  --surface-card: #FFFFFF;\n  --surface-deep: #1F2A5A;\n  --surface-soft-blue: #EEF2FB;\n  --surface-soft-purple: #EEE7F6;\n  --surface-soft-rose: #FDEEF2;\n  --surface-soft-gold: #FBE5C4;\n  --surface-soft-green: #E4F3EA;\n\n  /* --- Lines --- */\n  --border-hairline: #D8DCEA;     /* card borders, dividers */\n}\n\n/* ============================================================\n   NIED Typography — Poppins throughout\n   Sizes given desktop; mobile variants noted in comments.\n   ============================================================ */\n:root {\n  --font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;\n\n  /* weights */\n  --font-weight-regular: 400;\n  --font-weight-medium: 500;\n  --font-weight-semibold: 600;\n  --font-weight-bold: 700;\n\n  /* --- Heading scale (desktop) --- */\n  --font-size-h1: 56px;    /* mobile 36 */\n  --font-size-h2: 40px;    /* mobile 28 */\n  --font-size-h3: 30px;    /* mobile 22 */\n  --font-size-h4: 22px;    /* mobile 18 */\n  --font-size-eyebrow: 14px; /* mobile 13, UPPERCASE +0.08em */\n\n  /* --- Body scale (desktop) --- */\n  --font-size-lead: 20px;  /* mobile 18 */\n  --font-size-body: 18px;  /* mobile 16 */\n  --font-size-small: 15px; /* mobile 14 */\n  --font-size-button: 17px;/* mobile 16 */\n\n  /* line heights */\n  --line-height-h1: 1.1;\n  --line-height-h2: 1.15;\n  --line-height-h3: 1.2;\n  --line-height-h4: 1.3;\n  --line-height-body: 1.6;\n  --line-height-small: 1.5;\n  --line-height-eyebrow: 1.4;\n\n  /* letter spacing */\n  --letter-spacing-heading: -0.01em;\n  --letter-spacing-eyebrow: 0.08em;\n}\n\n/* ============================================================\n   NIED Spacing, radii, shadows, transitions\n   ============================================================ */\n:root {\n  /* --- Spacing scale --- */\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 24px;   /* gap between cards */\n  --space-6: 32px;   /* card padding (desktop) */\n  --space-7: 48px;\n  --space-8: 64px;\n  --space-9: 96px;   /* section rhythm */\n\n  /* --- Radii --- */\n  --radius-card: 16px;    /* cards, images */\n  --radius-pill: 999px;   /* buttons, chips, avatars */\n  --radius-sm: 8px;       /* inputs, small elements */\n\n  /* --- Shadows (soft, navy-tinted) --- */\n  --shadow-card: 0 4px 16px rgba(31, 42, 90, 0.08);\n  --shadow-card-hover: 0 8px 24px rgba(31, 42, 90, 0.12);\n\n  /* --- Overlay --- */\n  --overlay-image: rgba(31, 42, 90, 0.45); /* soft navy over photos */\n\n  /* --- Motion --- */\n  --transition-base: 200ms ease; /* @kind other */\n}\n\n<\u002Fstyle>\n<script src=\"ef96a98b-8cd0-4651-9e93-1dcc77bf59c8\"><\u002Fscript>\n<script src=\"0c7c59bb-1dc0-4c34-bf09-084eb22d2926\"><\u002Fscript>\n<style>\n  body { margin: 0; background: var(--surface-page); font-family: var(--font-family); color: var(--text-body); }\n  a { color: var(--color-action-blue); text-decoration: none; }\n  a:hover { color: var(--color-blue-deep); text-decoration: underline; }\n  * { box-sizing: border-box; }\n  select, input, button { font-family: var(--font-family); }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"background: var(--color-navy); color: #fff;\">\n  <div style=\"max-width: 1160px; margin: 0 auto; padding: 10px 32px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; font-size: 15px; line-height: 1.5;\">\n    <span style=\"display: inline-flex; align-items: center; gap: 8px; font-weight: 600;\">\n      <x-import component-from-global-scope=\"NIEDDesignSystem_e1fab8.Icon\" name=\"life-buoy\" color=\"#F7C6D3\" hint-size=\"20px,20px\" style=\"width:20px;height:20px\"><\u002Fx-import>\n      In crisis right now?\n    <\u002Fspan>\n    <span style=\"color: #D7DCEF;\">You don't have to wait or filter. Call or text <strong style=\"color:#fff;\">9-8-8<\u002Fstrong> (24/7, Canada-wide), or reach the NEDIC helpline at <strong style=\"color:#fff;\">1-866-633-4220<\u002Fstrong>.<\u002Fspan>\n    <a href=\"#crisis\" style=\"color: #F7C6D3; font-weight: 600; margin-left: auto; text-decoration: underline;\">Crisis resources<\u002Fa>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<main style=\"max-width: 1160px; margin: 0 auto; padding: 0 32px 96px;\">\n\n  <section style=\"padding: 72px 0 40px; max-width: 720px;\">\n    <x-import component-from-global-scope=\"NIEDDesignSystem_e1fab8.Eyebrow\" theme=\"purple\" hint-size=\"120px,18px\">Resource library<\u002Fx-import>\n    <h1 style=\"font-size: 56px; line-height: 1.12; letter-spacing: -0.01em; font-weight: 600; color: var(--text-heading); margin: 12px 0 16px; text-wrap: pretty;\">Find what you need, without reading everything.<\u002Fh1>\n    <p style=\"font-size: 20px; line-height: 1.6; color: var(--text-body); margin: 0; text-wrap: pretty;\">Two questions and we'll narrow the library down to the handful of resources that fit where you are today. Nothing here asks you to have it figured out.<\u002Fp>\n  <\u002Fsection>\n\n  <sc-if value=\"{{ guided }}\" hint-placeholder-val=\"{{ true }}\">\n    <section style=\"background: var(--surface-soft-purple); border-radius: 16px; padding: 40px; margin-bottom: 40px;\">\n      <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px; margin-bottom: 8px;\">\n        <span style=\"display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 999px; background: var(--color-purple); color: #fff; font-size: 14px; font-weight: 600;\">1<\u002Fspan>\n        <h2 style=\"font-size: 30px; line-height: 1.25; font-weight: 600; color: var(--text-heading); margin: 0;\">What are you dealing with?<\u002Fh2>\n        <span style=\"font-size: 15px; color: var(--text-muted);\">Pick one — you can change it later.<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0 40px;\">\n        <sc-for list=\"{{ topicChoices }}\" as=\"t\" hint-placeholder-count=\"8\">\n          <button sc-camel-on-click=\"{{ t.onPick }}\" style=\"{{ t.style }}\">{{ t.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px; margin-bottom: 8px;\">\n        <span style=\"{{ step2NumStyle }}\">2<\u002Fspan>\n        <h2 style=\"{{ step2HeadStyle }}\">What kind of thing do you want?<\u002Fh2>\n        <span style=\"font-size: 15px; color: var(--text-muted);\">This is your second click — results open right after.<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px;\">\n        <sc-for list=\"{{ formatChoices }}\" as=\"f\" hint-placeholder-count=\"5\">\n          <button sc-camel-on-click=\"{{ f.onPick }}\" style=\"{{ f.style }}\">\n            <x-import component-from-global-scope=\"NIEDDesignSystem_e1fab8.Icon\" name=\"{{ f.icon }}\" color=\"{{ f.iconColor }}\" hint-size=\"24px,24px\" style=\"width:24px;height:24px\"><\u002Fx-import>\n            <span style=\"font-size: 17px; font-weight: 600; color: var(--text-heading);\">{{ f.label }}<\u002Fspan>\n            <span style=\"font-size: 14px; color: var(--text-muted); font-weight: 400;\">{{ f.hint }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"margin-top: 32px; padding-top: 24px; border-top: 1px solid rgba(31,42,90,0.12); display: flex; flex-wrap: wrap; gap: 8px; align-items: center;\">\n        <span style=\"font-size: 17px; color: var(--text-body);\">Would rather look around on your own?<\u002Fspan>\n        <a sc-camel-on-click=\"{{ onBrowseAll }}\" style=\"font-size: 17px; font-weight: 600; cursor: pointer; text-decoration: underline;\">Browse everything ({{ totalCount }} resources)<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ browsing }}\" hint-placeholder-val=\"{{ false }}\">\n    <section>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; padding: 16px 20px; background: var(--surface-soft-blue); border-radius: 16px; margin-bottom: 8px;\">\n        <span style=\"font-size: 15px; font-weight: 600; color: var(--text-heading);\">Your answers<\u002Fspan>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 8px;\">\n          <sc-for list=\"{{ answerChips }}\" as=\"c\" hint-placeholder-count=\"2\">\n            <span style=\"display: inline-flex; align-items: center; gap: 8px; padding: 6px 8px 6px 14px; border-radius: 999px; background: #fff; border: 1px solid var(--border-hairline); font-size: 14px; font-weight: 600; color: var(--text-heading);\">\n              {{ c.label }}\n              <button sc-camel-on-click=\"{{ c.onClear }}\" aria-label=\"Remove filter\" style=\"display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 999px; border: none; background: var(--color-blue-mist); color: var(--color-action-blue); cursor: pointer; font-size: 14px; line-height: 1;\">×<\u002Fbutton>\n            <\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <a sc-camel-on-click=\"{{ onEditAnswers }}\" style=\"margin-left: auto; font-size: 15px; font-weight: 600; cursor: pointer;\">Start over<\u002Fa>\n      <\u002Fdiv>\n\n      <div style=\"{{ shellStyle }}\">\n\n        <aside style=\"{{ railWrapStyle }}\">\n          <div style=\"{{ railInnerStyle }}\">\n            <div style=\"display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px;\">\n              <h3 style=\"font-size: 22px; font-weight: 600; color: var(--text-heading); margin: 0;\">Filters<\u002Fh3>\n              <button sc-camel-on-click=\"{{ onCloseSheet }}\" style=\"{{ sheetCloseStyle }}\">Done<\u002Fbutton>\n            <\u002Fdiv>\n\n            <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n              <label for=\"prov\" style=\"font-size: 15px; font-weight: 600; color: var(--text-heading);\">Province or territory<\u002Flabel>\n              <sc-raw-select id=\"prov\" value=\"{{ province }}\" sc-camel-on-change=\"{{ onProvince }}\" style=\"padding: 12px 14px; border-radius: 8px; border: 1.5px solid var(--border-hairline); background: #fff; font-size: 16px; color: var(--text-body);\">\n                <sc-for list=\"{{ provinceOptions }}\" as=\"p\" hint-placeholder-count=\"6\">\n                  <option value=\"{{ p }}\">{{ p }}<\u002Foption>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-select>\n              <span style=\"font-size: 14px; color: var(--text-muted);\">Most resources are national. Province filters the service listings.<\u002Fspan>\n            <\u002Fdiv>\n\n            <div style=\"height: 1px; background: var(--border-hairline);\"><\u002Fdiv>\n\n            <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n              <span style=\"font-size: 15px; font-weight: 600; color: var(--text-heading);\">What I'm dealing with<\u002Fspan>\n              <sc-for list=\"{{ topicFilters }}\" as=\"t\" hint-placeholder-count=\"6\">\n                <label style=\"display: flex; align-items: flex-start; gap: 10px; font-size: 16px; color: var(--text-body); cursor: pointer; line-height: 1.4;\">\n                  <input type=\"checkbox\" checked=\"{{ t.on }}\" sc-camel-on-change=\"{{ t.onToggle }}\" style=\"margin-top: 3px; width: 17px; height: 17px; accent-color: #2E4FA3; cursor: pointer;\">\n                  <span>{{ t.label }} <span style=\"color: var(--text-muted); font-size: 14px;\">{{ t.count }}<\u002Fspan><\u002Fspan>\n                <\u002Flabel>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"height: 1px; background: var(--border-hairline);\"><\u002Fdiv>\n\n            <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n              <span style=\"font-size: 15px; font-weight: 600; color: var(--text-heading);\">Kind of thing<\u002Fspan>\n              <div style=\"display: flex; flex-wrap: wrap; gap: 8px;\">\n                <sc-for list=\"{{ formatFilters }}\" as=\"f\" hint-placeholder-count=\"5\">\n                  <button sc-camel-on-click=\"{{ f.onToggle }}\" style=\"{{ f.style }}\">{{ f.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"height: 1px; background: var(--border-hairline);\"><\u002Fdiv>\n\n            <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n              <span style=\"font-size: 15px; font-weight: 600; color: var(--text-heading);\">Resource type<\u002Fspan>\n              <sc-for list=\"{{ typeFilters }}\" as=\"t\" hint-placeholder-count=\"5\">\n                <label style=\"display: flex; align-items: center; gap: 10px; font-size: 16px; color: var(--text-body); cursor: pointer;\">\n                  <input type=\"checkbox\" checked=\"{{ t.on }}\" sc-camel-on-change=\"{{ t.onToggle }}\" style=\"width: 17px; height: 17px; accent-color: #2E4FA3; cursor: pointer;\">\n                  <span>{{ t.label }} <span style=\"color: var(--text-muted); font-size: 14px;\">{{ t.count }}<\u002Fspan><\u002Fspan>\n                <\u002Flabel>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"height: 1px; background: var(--border-hairline);\"><\u002Fdiv>\n\n            <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n              <span style=\"font-size: 15px; font-weight: 600; color: var(--text-heading);\">Who it's for<\u002Fspan>\n              <sc-for list=\"{{ audienceFilters }}\" as=\"a\" hint-placeholder-count=\"4\">\n                <label style=\"display: flex; align-items: center; gap: 10px; font-size: 16px; color: var(--text-body); cursor: pointer;\">\n                  <input type=\"checkbox\" checked=\"{{ a.on }}\" sc-camel-on-change=\"{{ a.onToggle }}\" style=\"width: 17px; height: 17px; accent-color: #2E4FA3; cursor: pointer;\">\n                  <span>{{ a.label }} <span style=\"color: var(--text-muted); font-size: 14px;\">{{ a.count }}<\u002Fspan><\u002Fspan>\n                <\u002Flabel>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"height: 1px; background: var(--border-hairline);\"><\u002Fdiv>\n\n            <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n              <span style=\"font-size: 15px; font-weight: 600; color: var(--text-heading);\">Where it's from<\u002Fspan>\n              <div style=\"display: flex; padding: 4px; background: var(--color-blue-mist); border-radius: 999px;\">\n                <sc-for list=\"{{ sourceFilters }}\" as=\"s\" hint-placeholder-count=\"3\">\n                  <button sc-camel-on-click=\"{{ s.onPick }}\" style=\"{{ s.style }}\">{{ s.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <button sc-camel-on-click=\"{{ onClearAll }}\" style=\"align-self: flex-start; background: none; border: none; padding: 0; font-size: 15px; font-weight: 600; color: var(--color-action-blue); cursor: pointer; text-decoration: underline;\">Clear all filters<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Faside>\n\n        <div style=\"min-width: 0;\">\n\n          <div style=\"display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 20px;\">\n            <div style=\"position: relative; flex: 1 1 260px; display: flex; align-items: center; gap: 10px; background: #fff; border: 1.5px solid var(--border-hairline); border-radius: 999px; padding: 0 18px;\">\n              <x-import component-from-global-scope=\"NIEDDesignSystem_e1fab8.Icon\" name=\"search\" color=\"#6E7780\" hint-size=\"20px,20px\" style=\"width:20px;height:20px;flex:none\"><\u002Fx-import>\n              <input placeholder=\"Search resources\" value=\"{{ search }}\" sc-camel-on-change=\"{{ onSearch }}\" style=\"flex: 1; min-width: 0; border: none; outline: none; background: transparent; padding: 13px 0; font-size: 16px; color: var(--text-body);\">\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ onOpenSheet }}\" style=\"{{ sheetOpenBtnStyle }}\">Filters ({{ activeCount }})<\u002Fbutton>\n            <sc-raw-select value=\"{{ sort }}\" sc-camel-on-change=\"{{ onSort }}\" style=\"padding: 12px 14px; border-radius: 999px; border: 1.5px solid var(--border-hairline); background: #fff; font-size: 16px; color: var(--text-body);\">\n              <sc-for list=\"{{ sortOptions }}\" as=\"s\" hint-placeholder-count=\"3\">\n                <option value=\"{{ s }}\">{{ s }}<\u002Foption>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-select>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ loading }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background: #fff; border: 1px solid var(--border-hairline); border-radius: 16px; padding: 40px; text-align: center; color: var(--text-muted);\">Loading resources…<\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ loadError }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background: var(--surface-soft-rose); border-radius: 16px; padding: 24px; margin-bottom: 24px; color: var(--text-heading);\">Couldn't load resources right now — please try refreshing.<\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ showServices }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background: var(--surface-soft-green); border-radius: 16px; padding: 28px; margin-bottom: 28px;\">\n              <x-import component-from-global-scope=\"NIEDDesignSystem_e1fab8.Eyebrow\" theme=\"green\" hint-size=\"180px,18px\">Services near you<\u002Fx-import>\n              <h2 style=\"font-size: 30px; line-height: 1.25; font-weight: 600; color: var(--text-heading); margin: 10px 0 6px;\">{{ servicesHeading }}<\u002Fh2>\n              <p style=\"font-size: 17px; line-height: 1.6; color: var(--text-body); margin: 0 0 20px; max-width: 62ch;\">Provincial and regional programs that take referrals or self-referrals. We list them; we don't run them.<\u002Fp>\n              <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px;\">\n                <sc-for list=\"{{ services }}\" as=\"s\" hint-placeholder-count=\"3\">\n                  <div style=\"background: #fff; border: 1px solid var(--border-hairline); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 8px;\">\n                    <span style=\"font-size: 18px; font-weight: 600; color: var(--text-heading); line-height: 1.35;\">{{ s.name }}<\u002Fspan>\n                    <span style=\"font-size: 15px; color: var(--text-muted); line-height: 1.5;\">{{ s.detail }}<\u002Fspan>\n                    <a href=\"#\" style=\"font-size: 15px; font-weight: 600; margin-top: 4px;\">{{ s.cta }}<\u002Fa>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; margin-bottom: 16px;\">\n            <span style=\"font-size: 22px; font-weight: 600; color: var(--text-heading);\">{{ resultLabel }}<\u002Fspan>\n            <span style=\"font-size: 16px; color: var(--text-muted);\">{{ resultSub }}<\u002Fspan>\n          <\u002Fdiv>\n\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px;\">\n            <sc-for list=\"{{ results }}\" as=\"r\" hint-placeholder-count=\"6\">\n              <x-import component-from-global-scope=\"NIEDDesignSystem_e1fab8.Card\" theme=\"{{ r.theme }}\" interactive=\"{{ true }}\" hint-size=\"100%,280px\">\n                <div style=\"display: flex; flex-direction: column; gap: 12px; height: 100%;\">\n                  <div style=\"display: flex; align-items: center; gap: 8px;\">\n                    <x-import component-from-global-scope=\"NIEDDesignSystem_e1fab8.Icon\" name=\"{{ r.icon }}\" color=\"{{ r.iconColor }}\" hint-size=\"20px,20px\" style=\"width:20px;height:20px\"><\u002Fx-import>\n                    <span style=\"font-size: 14px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: {{ r.iconColor }};\">{{ r.type }}<\u002Fspan>\n                    <span style=\"font-size: 14px; color: var(--text-muted);\">{{ r.time }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <h3 style=\"font-size: 22px; line-height: 1.32; font-weight: 600; color: var(--text-heading); margin: 0; text-wrap: pretty;\">{{ r.title }}<\u002Fh3>\n                  <sc-if value=\"{{ r.external }}\" hint-placeholder-val=\"{{ false }}\">\n                    <span style=\"display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--text-muted);\">\n                      <x-import component-from-global-scope=\"NIEDDesignSystem_e1fab8.Icon\" name=\"external-link\" color=\"#6E7780\" hint-size=\"15px,15px\" style=\"width:15px;height:15px\"><\u002Fx-import>\n                      External — {{ r.source }}\n                    <\u002Fspan>\n                  <\u002Fsc-if>\n                  <div style=\"display: flex; flex-wrap: wrap; gap: 6px;\">\n                    <x-import component-from-global-scope=\"NIEDDesignSystem_e1fab8.Badge\" theme=\"{{ r.theme }}\" hint-size=\"90px,26px\">{{ r.topic }}<\u002Fx-import>\n                    <x-import component-from-global-scope=\"NIEDDesignSystem_e1fab8.Badge\" theme=\"blue\" hint-size=\"90px,26px\">{{ r.audience }}<\u002Fx-import>\n                    <x-import component-from-global-scope=\"NIEDDesignSystem_e1fab8.Badge\" theme=\"periwinkle\" hint-size=\"70px,26px\">{{ r.region }}<\u002Fx-import>\n                  <\u002Fdiv>\n                  <div style=\"margin-top: auto; padding-top: 14px; border-top: 1px solid var(--border-hairline); display: flex; align-items: center; justify-content: space-between; gap: 12px;\">\n                    <label style=\"display: inline-flex; align-items: center; gap: 8px; font-size: 15px; color: var(--text-body); cursor: pointer;\">\n                      <input type=\"checkbox\" checked=\"{{ r.picked }}\" sc-camel-on-change=\"{{ r.onPick }}\" style=\"width: 17px; height: 17px; accent-color: #2E4FA3; cursor: pointer;\">\n                      Email me this\n                    <\u002Flabel>\n                    <a href=\"{{ r.href }}\" style=\"display: inline-flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600; white-space: nowrap;\">\n                      {{ r.action }}\n                      <x-import component-from-global-scope=\"NIEDDesignSystem_e1fab8.Icon\" name=\"{{ r.actionIcon }}\" color=\"#2E4FA3\" hint-size=\"16px,16px\" style=\"width:16px;height:16px\"><\u002Fx-import>\n                    <\u002Fa>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fx-import>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ empty }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background: #fff; border: 1px solid var(--border-hairline); border-radius: 16px; padding: 40px; text-align: center;\">\n              <h3 style=\"font-size: 22px; font-weight: 600; color: var(--text-heading); margin: 0 0 8px;\">Nothing matches all of those yet.<\u002Fh3>\n              <p style=\"font-size: 17px; line-height: 1.6; color: var(--text-body); margin: 0 0 20px;\">Try loosening one filter — or tell us what you were looking for and we'll point you somewhere.<\u002Fp>\n              <div style=\"display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;\">\n                <x-import component-from-global-scope=\"NIEDDesignSystem_e1fab8.Button\" variant=\"secondary\" size=\"sm\" sc-camel-on-click=\"{{ onClearAll }}\" hint-size=\"150px,40px\">Clear filters<\u002Fx-import>\n                <x-import component-from-global-scope=\"NIEDDesignSystem_e1fab8.Button\" variant=\"primary\" size=\"sm\" hint-size=\"150px,40px\">Ask us directly<\u002Fx-import>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <section id=\"crisis\" style=\"margin-top: 72px; background: var(--surface-soft-rose); border-radius: 16px; padding: 40px;\">\n    <x-import component-from-global-scope=\"NIEDDesignSystem_e1fab8.Eyebrow\" theme=\"rose\" hint-size=\"160px,18px\">If today is hard<\u002Fx-import>\n    <h2 style=\"font-size: 40px; line-height: 1.2; font-weight: 600; color: var(--text-heading); margin: 12px 0 12px; max-width: 20ch;\">Crisis support, no filtering required.<\u002Fh2>\n    <p style=\"font-size: 18px; line-height: 1.6; color: var(--text-body); margin: 0 0 24px; max-width: 62ch;\">If you or your loved one is in immediate danger, call 911. Otherwise these lines are answered by people, right now.<\u002Fp>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px;\">\n      <div style=\"background: #fff; border: 1px solid var(--border-hairline); border-radius: 16px; padding: 20px;\">\n        <div style=\"font-size: 18px; font-weight: 600; color: var(--text-heading);\">9-8-8 Suicide Crisis Helpline<\u002Fdiv>\n        <div style=\"font-size: 15px; color: var(--text-muted); margin-top: 6px;\">Call or text, 24/7, English and French<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: #fff; border: 1px solid var(--border-hairline); border-radius: 16px; padding: 20px;\">\n        <div style=\"font-size: 18px; font-weight: 600; color: var(--text-heading);\">NEDIC Helpline<\u002Fdiv>\n        <div style=\"font-size: 15px; color: var(--text-muted); margin-top: 6px;\">1-866-633-4220 — instant chat and phone support<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: #fff; border: 1px solid var(--border-hairline); border-radius: 16px; padding: 20px;\">\n        <div style=\"font-size: 18px; font-weight: 600; color: var(--text-heading);\">Kids Help Phone<\u002Fdiv>\n        <div style=\"font-size: 15px; color: var(--text-muted); margin-top: 6px;\">Text CONNECT to 686868 — for youth, 24/7<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fmain>\n\n<sc-if value=\"{{ hasPicks }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: #fff; border-top: 1px solid var(--border-hairline); box-shadow: 0 -8px 24px rgba(31,42,90,0.12);\">\n    <div style=\"max-width: 1160px; margin: 0 auto; padding: 16px 32px; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center;\">\n      <span style=\"display: inline-flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600; color: var(--text-heading);\">\n        <span style=\"display: inline-flex; align-items: center; justify-content: center; min-width: 28px; height: 28px; padding: 0 8px; border-radius: 999px; background: var(--color-action-blue); color: #fff; font-size: 15px;\">{{ pickCount }}<\u002Fspan>\n        {{ pickLabel }}\n      <\u002Fspan>\n      <span style=\"font-size: 15px; color: var(--text-muted);\">We'll send the links to your inbox so you can come back to them.<\u002Fspan>\n      <div style=\"display: flex; gap: 10px; align-items: center; margin-left: auto; flex-wrap: wrap;\">\n        <input placeholder=\"you@example.com\" aria-label=\"Email address\" style=\"padding: 12px 16px; border-radius: 8px; border: 1.5px solid var(--border-hairline); font-size: 16px; color: var(--text-body); min-width: 220px;\">\n        <x-import component-from-global-scope=\"NIEDDesignSystem_e1fab8.Button\" variant=\"primary\" size=\"sm\" hint-size=\"140px,40px\">Send me these<\u002Fx-import>\n        <button sc-camel-on-click=\"{{ onClearPicks }}\" style=\"background: none; border: none; font-size: 15px; font-weight: 600; color: var(--text-muted); cursor: pointer; text-decoration: underline;\">Clear<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:1600}}\">\nconst RESOURCES_ENDPOINT = 'https://www.nied.ca/_functions/resourcesData';\n\n// Static UX categories — not CMS-driven, these are the five broad \"kind of\n// thing\" buckets shown in the guided step 2 (distinct from the per-resource\n// icon/action which DOES come from the CMS ResourceTypes collection below).\nconst FORMATS = [\n  { id: 'read',     label: 'Read',     hint: '5–15 min',      icon: 'book-open' },\n  { id: 'watch',    label: 'Watch',    hint: 'video',         icon: 'play-circle' },\n  { id: 'listen',   label: 'Listen',   hint: 'audio',         icon: 'headphones' },\n  { id: 'download', label: 'Download', hint: 'save for later',icon: 'download' },\n  { id: 'service',  label: 'Find a service', hint: 'people',  icon: 'map-pin' }\n];\n\nconst SORTS = ['Most helpful first', 'Newest first', 'Shortest first', 'A–Z'];\n\nconst THEME_FG = {\n  blue: 'var(--color-action-blue)',\n  periwinkle: 'var(--color-periwinkle)',\n  gold: 'var(--color-gold-text)',\n  rose: 'var(--color-rose)',\n  purple: 'var(--color-purple)',\n  green: 'var(--color-green-solid)'\n};\n\n// The Card/Badge/Eyebrow design-system components only accept these 6 named\n// themes — a CMS topic stores an actual brand hex in its \"accent\" colour\n// field, so we resolve that hex back to the matching theme name here. Unknown\n// or missing colours fall back to 'blue'.\nconst THEME_HEX = {\n  blue: '#2E4FA3', periwinkle: '#5C6FC4', gold: '#ECA233',\n  rose: '#C13362', purple: '#6C3FA3', green: '#4CA66B'\n};\nfunction themeFromColor(hex) {\n  if (!hex) return 'blue';\n  const h = String(hex).toUpperCase();\n  for (const name of Object.keys(THEME_HEX)) {\n    if (THEME_HEX[name] === h) return name;\n  }\n  return 'blue';\n}\n\nconst DEFAULT_SERVICES = [\n  { name: 'Ask NIED for a warm referral', detail: 'Tell us where you live and we will point you to what exists nearby.', cta: 'Contact us' },\n  { name: 'NEDIC service provider directory', detail: 'Searchable national listing of treatment and support providers.', cta: 'Open directory' }\n];\n\nclass Component extends DCLogic {\n  state = {\n    loading: true,\n    loadError: false,\n    resources: [],\n    topicsData: [],\n    resourceTypesData: [],\n    audiencesData: [],\n    provincesData: [],\n\n    phase: 'guided',\n    topicAnswered: false,\n    topics: [],\n    formats: [],\n    types: [],\n    audiences: [],\n    province: 'All of Canada',\n    source: 'All',\n    search: '',\n    sort: SORTS[0],\n    picks: [],\n    sheetOpen: false,\n    mobile: false\n  };\n\n  componentDidMount() {\n    this._onResize = () => {\n      const m = window.innerWidth < 980;\n      if (m !== this.state.mobile) this.setState({ mobile: m });\n    };\n    this._onResize();\n    window.addEventListener('resize', this._onResize);\n    this.loadData();\n  }\n  componentWillUnmount() { window.removeEventListener('resize', this._onResize); }\n\n  async loadData() {\n    try {\n      const res = await fetch(RESOURCES_ENDPOINT);\n      if (!res.ok) throw new Error('bad response: ' + res.status);\n      const data = await res.json();\n      this.setState({\n        loading: false,\n        loadError: false,\n        resources: data.resources || [],\n        topicsData: data.topics || [],\n        resourceTypesData: data.resourceTypes || [],\n        audiencesData: data.audiences || [],\n        provincesData: data.provinces || []\n      });\n    } catch (err) {\n      console.error('Failed to load resources:', err);\n      this.setState({ loading: false, loadError: true });\n    }\n  }\n\n  toggle(key, val) {\n    this.setState(s => {\n      const arr = s[key].includes(val) ? s[key].filter(v => v !== val) : s[key].concat(val);\n      return { [key]: arr };\n    });\n  }\n\n  // Maps a fetched CMS resource item (with topics/audiences/provinces/\n  // resourceTypes inlined via the backend's wixData .include()) into the flat\n  // shape the rest of this component's rendering logic expects.\n  items() {\n    return this.state.resources.map(r => {\n      const type = (r.resourceTypes && r.resourceTypes[0]) || {};\n      const topicRefs = r.topics || [];\n      const primaryTopic = topicRefs[0] || null;\n      const theme = primaryTopic ? themeFromColor(primaryTopic.color) : 'blue';\n      const audienceList = (r.audiences || []).map(a => a.title);\n      const provinceList = (r.provinces || []).map(p => p.title);\n      const action = type.description || 'Read';\n      const publishedTime = r.datePublished ? new Date(r.datePublished).getTime() : (r.date ? new Date(r.date).getTime() : 0);\n\n      return {\n        id: r._id,\n        title: r.title,\n        type: type.title || '',\n        time: r.duration || '',\n        durationMinutes: r.durationMinutes || null,\n        topicIds: topicRefs.map(t => t._id),\n        topic: primaryTopic ? primaryTopic.title : '',\n        theme,\n        audienceList,\n        audience: audienceList[0] || '',\n        isService: !!r.isService,\n        summary: r.summary || '',\n        region: (r.isNational || provinceList.length === 0) ? 'All of Canada' : provinceList[0],\n        source: r.sourceName || 'NIED',\n        external: r.sourceType === 'Partner',\n        format: action.toLowerCase(),\n        icon: type.iconName || 'file-text',\n        action,\n        actionIcon: type.actionIcon || 'arrow-right',\n        iconColor: THEME_FG[theme],\n        href: r.externalUrl || r.file || '#',\n        rank: r.helpfulRank || 2,\n        // Smaller = more recent, so the existing ascending \"Newest first\"\n        // comparator keeps working unchanged.\n        age: publishedTime ? (Date.now() - publishedTime) : Number.MAX_SAFE_INTEGER\n      };\n    });\n  }\n\n  matches(r, s) {\n    if (s.topics.length && !s.topics.some(id => r.topicIds.includes(id))) return false;\n    if (s.formats.length && !s.formats.includes(r.format)) return false;\n    if (s.types.length && !s.types.includes(r.type)) return false;\n    if (s.audiences.length && !s.audiences.some(a => r.audienceList.includes(a))) return false;\n    if (s.source === 'NIED' && r.external) return false;\n    if (s.source === 'Partners' && !r.external) return false;\n    if (s.province !== 'All of Canada' && r.region !== 'All of Canada' && r.region !== s.province) return false;\n    if (s.search.trim()) {\n      const q = s.search.toLowerCase();\n      if (!(r.title + ' ' + r.topic + ' ' + r.type + ' ' + r.source).toLowerCase().includes(q)) return false;\n    }\n    return true;\n  }\n\n  countWith(patch) {\n    const s = { ...this.state, ...patch };\n    return this.items().filter(r => this.matches(r, s)).length;\n  }\n\n  chip(active, theme) {\n    return {\n      padding: '11px 18px', borderRadius: '999px', cursor: 'pointer', fontSize: '16px',\n      fontWeight: 600, lineHeight: 1.2, textAlign: 'left',\n      transition: 'background 200ms ease, border-color 200ms ease, color 200ms ease',\n      border: active ? '2px solid ' + THEME_FG[theme] : '2px solid var(--border-hairline)',\n      background: active ? THEME_FG[theme] : '#fff',\n      color: active ? '#fff' : 'var(--text-heading)'\n    };\n  }\n\n  renderVals() {\n    const s = this.state;\n\n    // CMS-driven lookups, rebuilt from fetched state each render.\n    const TOPICS = s.topicsData.map(t => ({ id: t._id, label: t.title, theme: themeFromColor(t.color) }));\n    const TYPES = s.resourceTypesData.map(t => t.title);\n    const AUDIENCES = s.audiencesData.map(a => a.title);\n    const PROVINCES = ['All of Canada'].concat(s.provincesData.map(p => p.title));\n\n    const all = this.items();\n    const filtered = all.filter(r => this.matches(r, s));\n    const order = {\n      'Most helpful first': (a, b) => a.rank - b.rank,\n      'Newest first': (a, b) => a.age - b.age,\n      'Shortest first': (a, b) => (a.durationMinutes || parseInt(a.time) || 99) - (b.durationMinutes || parseInt(b.time) || 99),\n      'A–Z': (a, b) => a.title.localeCompare(b.title)\n    }[s.sort];\n    filtered.sort(order);\n\n    const topicChoices = TOPICS.map(t => ({\n      label: t.label,\n      style: this.chip(s.topics.includes(t.id), t.theme),\n      onPick: () => this.setState({ topics: [t.id], topicAnswered: true })\n    })).concat([{\n      label: 'Show me all topics',\n      style: { ...this.chip(s.topicAnswered && !s.topics.length, 'blue'), fontStyle: 'normal', opacity: 1 },\n      onPick: () => this.setState({ topics: [], topicAnswered: true })\n    }]);\n\n    const step2Live = s.topicAnswered;\n    const formatChoices = FORMATS.concat([{ id: 'any', label: 'Show me everything', hint: 'all formats', icon: 'layout-grid' }]).map(f => ({\n      label: f.label, hint: f.hint, icon: f.icon,\n      iconColor: s.formats.includes(f.id) ? 'var(--color-action-blue)' : 'var(--color-periwinkle)',\n      style: {\n        display: 'flex', flexDirection: 'column', alignItems: 'flex-start', gap: '8px',\n        minWidth: '150px', flex: '1 1 150px', padding: '18px 20px', borderRadius: '16px',\n        cursor: 'pointer', textAlign: 'left', background: '#fff',\n        border: s.formats.includes(f.id) ? '2px solid var(--color-action-blue)' : '2px solid transparent',\n        boxShadow: '0 4px 16px rgba(31,42,90,0.08)',\n        transition: 'border-color 200ms ease, box-shadow 200ms ease',\n        opacity: step2Live ? 1 : 0.55\n      },\n      onPick: () => this.setState({ formats: f.id === 'any' ? [] : [f.id], phase: 'browsing' })\n    }));\n\n    const answerChips = [];\n    s.topics.forEach(id => {\n      const t = TOPICS.find(x => x.id === id);\n      if (t) answerChips.push({ label: t.label, onClear: () => this.toggle('topics', id) });\n    });\n    s.formats.forEach(id => {\n      const f = FORMATS.find(x => x.id === id);\n      if (f) answerChips.push({ label: f.label, onClear: () => this.toggle('formats', id) });\n    });\n    if (s.province !== 'All of Canada') answerChips.push({ label: s.province, onClear: () => this.setState({ province: 'All of Canada' }) });\n    if (!answerChips.length) answerChips.push({ label: 'Everything', onClear: () => this.setState({ phase: 'guided' }) });\n\n    const sheet = s.mobile;\n    const rawServices = all\n      .filter(r => r.isService && (r.region === s.province || r.region === 'All of Canada'))\n      .map(r => ({ name: r.title, detail: r.summary || r.time, cta: r.action || 'Learn more' }));\n    const services = rawServices.length ? rawServices : DEFAULT_SERVICES;\n\n    const segStyle = on => ({\n      flex: 1, padding: '9px 10px', borderRadius: '999px', border: 'none', cursor: 'pointer',\n      fontSize: '15px', fontWeight: 600, transition: 'background 200ms ease',\n      background: on ? 'var(--color-action-blue)' : 'transparent',\n      color: on ? '#fff' : 'var(--color-action-blue)'\n    });\n\n    const activeCount = s.topics.length + s.formats.length + s.types.length + s.audiences.length +\n      (s.province !== 'All of Canada' ? 1 : 0) + (s.source !== 'All' ? 1 : 0);\n\n    return {\n      loading: s.loading,\n      loadError: s.loadError,\n      guided: s.phase === 'guided',\n      browsing: s.phase === 'browsing',\n      totalCount: String(all.length),\n      topicChoices, formatChoices, answerChips,\n      step2NumStyle: {\n        display: 'inline-flex', alignItems: 'center', justifyContent: 'center', width: '26px', height: '26px',\n        borderRadius: '999px', fontSize: '14px', fontWeight: 600, color: '#fff',\n        background: step2Live ? 'var(--color-purple)' : 'rgba(108,63,163,0.4)'\n      },\n      step2HeadStyle: {\n        fontSize: '30px', lineHeight: 1.25, fontWeight: 600, margin: 0,\n        color: step2Live ? 'var(--text-heading)' : 'rgba(31,42,90,0.5)'\n      },\n      onBrowseAll: () => this.setState({ phase: 'browsing', topics: [], formats: [], topicAnswered: true }),\n      onEditAnswers: () => this.setState({ phase: 'guided', topicAnswered: false, topics: [], formats: [], types: [], audiences: [], province: 'All of Canada', source: 'All', search: '' }),\n\n      shellStyle: {\n        display: 'grid',\n        gridTemplateColumns: sheet ? '1fr' : '280px minmax(0, 1fr)',\n        gap: '32px', alignItems: 'start', marginTop: '24px'\n      },\n      railWrapStyle: sheet\n        ? { display: s.sheetOpen ? 'block' : 'none', position: 'fixed', inset: 0, zIndex: 50, background: 'rgba(31,42,90,0.45)' }\n        : { position: 'sticky', top: '24px' },\n      railInnerStyle: sheet\n        ? { position: 'absolute', left: 0, right: 0, bottom: 0, maxHeight: '82vh', overflowY: 'auto', background: 'var(--surface-card)', borderRadius: '16px 16px 0 0', padding: '24px', display: 'flex', flexDirection: 'column', gap: '20px' }\n        : { background: 'var(--surface-card)', border: '1px solid var(--border-hairline)', borderRadius: '16px', padding: '24px', display: 'flex', flexDirection: 'column', gap: '20px', boxShadow: '0 4px 16px rgba(31,42,90,0.08)' },\n      sheetCloseStyle: sheet\n        ? { background: 'var(--color-action-blue)', color: '#fff', border: 'none', borderRadius: '999px', padding: '8px 18px', fontSize: '15px', fontWeight: 600, cursor: 'pointer' }\n        : { display: 'none' },\n      sheetOpenBtnStyle: sheet\n        ? { display: 'inline-flex', alignItems: 'center', gap: '8px', padding: '13px 20px', borderRadius: '999px', border: '2px solid var(--color-action-blue)', background: '#fff', color: 'var(--color-action-blue)', fontSize: '16px', fontWeight: 600, cursor: 'pointer' }\n        : { display: 'none' },\n      onOpenSheet: () => this.setState({ sheetOpen: true }),\n      onCloseSheet: () => this.setState({ sheetOpen: false }),\n\n      province: s.province,\n      provinceOptions: PROVINCES,\n      onProvince: e => this.setState({ province: e.target.value }),\n      topicFilters: TOPICS.map(t => ({\n        label: t.label, on: s.topics.includes(t.id),\n        count: this.countWith({ topics: [t.id] }),\n        onToggle: () => this.toggle('topics', t.id)\n      })),\n      formatFilters: FORMATS.map(f => ({\n        label: f.label, style: this.chip(s.formats.includes(f.id), 'blue'),\n        onToggle: () => this.toggle('formats', f.id)\n      })),\n      typeFilters: TYPES.map(t => ({\n        label: t, on: s.types.includes(t),\n        count: this.countWith({ types: [t] }),\n        onToggle: () => this.toggle('types', t)\n      })),\n      audienceFilters: AUDIENCES.map(a => ({\n        label: a, on: s.audiences.includes(a),\n        count: this.countWith({ audiences: [a] }),\n        onToggle: () => this.toggle('audiences', a)\n      })),\n      sourceFilters: ['All', 'NIED', 'Partners'].map(k => ({\n        label: k === 'Partners' ? 'Partner orgs' : k,\n        style: segStyle(s.source === k),\n        onPick: () => this.setState({ source: k })\n      })),\n      onClearAll: () => this.setState({ topics: [], formats: [], types: [], audiences: [], province: 'All of Canada', source: 'All', search: '' }),\n      activeCount,\n\n      search: s.search,\n      onSearch: e => this.setState({ search: e.target.value }),\n      sort: s.sort,\n      sortOptions: SORTS,\n      onSort: e => this.setState({ sort: e.target.value }),\n\n      showServices: s.province !== 'All of Canada',\n      servicesHeading: 'In ' + s.province,\n      services,\n\n      results: filtered.map(r => ({\n        ...r,\n        picked: s.picks.includes(r.id),\n        onPick: () => this.toggle('picks', r.id)\n      })),\n      empty: !s.loading && filtered.length === 0,\n      resultLabel: filtered.length + (filtered.length === 1 ? ' resource' : ' resources'),\n      resultSub: activeCount ? 'matching your filters' : 'in the library',\n\n      hasPicks: s.picks.length > 0,\n      pickCount: s.picks.length,\n      pickLabel: s.picks.length === 1 ? 'resource selected' : 'resources selected',\n      onClearPicks: () => this.setState({ picks: [] })\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
